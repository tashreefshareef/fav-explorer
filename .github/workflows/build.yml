name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Same script used locally, so CI and a developer machine cannot drift.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Config Release

      - name: Hash agreement check
        # The one failure that is otherwise invisible: if the C++ and C# path
        # hashes ever disagree, hearts silently stop drawing.
        shell: pwsh
        run: |
          cmake -S tools/probe -B build/probe -A x64
          cmake --build build/probe --config Release
          dotnet build tools/selftest/SelfTest.csproj -c Release
          $dir = 'C:\Windows\System32'
          $a = (& tools/selftest/bin/Release/net10.0/SelfTest.exe hash $dir) -replace '.*-> ',''
          $b = ((& build/probe/Release/probe.exe --hash $dir) | Select-Object -Last 1) -replace '.*-> ',''
          "C#  $a"; "C++ $b"
          if ($a -ne $b) { throw "hash mismatch between C# and C++" }

      - uses: actions/upload-artifact@v4
        with:
          name: fav-explorer-${{ github.sha }}
          path: build/installer/*.exe
          if-no-files-found: error

  release:
    # Only tags publish, and only the installer CI just built - never one from a
    # developer machine.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fav-explorer-${{ github.sha }}
          path: installer

      - name: Check tag matches app version
        # The installer is named from the exe's version, so a tag that disagrees
        # would publish a release whose download says something else.
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $exe = Get-ChildItem installer -Filter *.exe | Select-Object -First 1
          if ($exe.Name -ne "FavExplorerSetup-$tag.exe") {
            throw "tag v$tag does not match $($exe.Name) - bump <Version> in FavExplorer.csproj"
          }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' (Get-ChildItem installer -Filter *.exe).FullName `
            --repo '${{ github.repository }}' --title 'Fav Explorer ${{ github.ref_name }}' --generate-notes `
            --notes 'Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org). See the [code signing policy](https://github.com/tashreefshareef/fav-explorer#code-signing-policy).'
